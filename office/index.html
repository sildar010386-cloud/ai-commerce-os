}

      if(c.phone>.01){sX=lerp(sX,-.7,c.phone);eX=lerp(eX,-1.85,c.phone);sY=lerp(sY,-.15,c.phone);}
      if(c.point>.01){sX=lerp(sX,-1.4,c.point);eX=lerp(eX,-.12,c.point);sY=lerp(sY,pointRel,c.point);sZ=lerp(sZ,.05,c.point);}
    }else{
      if(c.paper>.01){sX=lerp(sX,-.55,c.paper);eX=lerp(eX,-1.3,c.paper);sY=lerp(sY,.35,c.paper);}
      if(c.point>.01){sX=lerp(sX,-.35,c.point);eX=lerp(eX,-1.6,c.point);sY=lerp(sY,.7,c.point);}
    }
    if(c.stretch>.01){sX=lerp(sX,-2.95,c.stretch);eX=lerp(eX,-.1,c.stretch);sZ=lerp(sZ,.28,c.stretch);sY=lerp(sY,0,c.stretch);}
    if(c.lean>.01&&S_>.5){sX=lerp(sX,-.15,c.lean*.5);eX=lerp(eX,-.6,c.lean*.5);}
    a.sh.rotation.set(sX,sY,sx*sZ);a.el.rotation.x=eX;
    const up=-(sX+eX);
    if(right){r.props.phone.visible=c.phone>.5;r.props.cup.visible=c.cup>.5&&c.phone<.5;r.props.phone.rotation.x=up+.55;r.props.cup.rotation.x=up;}
    else{r.props.paper.visible=c.paper>.5;r.props.paper.rotation.x=up-.1;}
  }
  // desk cup
  const dc=p.deskCup;dc.visible=p.cupDesk&&p.cupVis&&!p.hidden&&S_>.9;if(dc.visible)dc.position.set(p.cupPos.x,p.cupPos.y,p.cupPos.z);
  // bubble
  p.bub.visible=p.speaking&&!p.hidden;
  if(p.speaking&&p.bubShown!==p.topic){p.bubShown=p.topic;p.bub.element.firstChild.firstChild.textContent=p.topic;}
  const cp=p.hidden?'':(p.cap||'');if(cp!==p.capShown){p.capShown=cp;p.chip.element.lastChild.textContent=cp;p.chip.element.setAttribute('aria-label',INFO[p.id].name+', '+INFO[p.id].role+(cp?', '+cp:''));}
}
/* ---- simulation step ---- */
const dl=Math.hypot;
function simStep(dt){
  T+=dt;director(dt);
  for(const id of IDS)stepFSM(crew[id],dt);
  separate();
  for(const id of IDS){const p=crew[id];animateP(p,dt);const st=p.stat;if(p.hidden||p.away)st.away+=dt;else if(p.cur===null&&p.q.length===0)st.work+=dt;else st.other+=dt;}
  {const hd=IDS.filter(i=>crew[i].hidden).map(i=>INFO[i].name);const tx=hd.length?'🚪 '+hd.join(', ')+(hd.length>1?' вышли':' вышел'):'';if(dnEl.dataset.t!==tx){dnEl.dataset.t=tx;dnEl.textContent=tx;dnEl.style.display=tx?'':'none';}}
  updateScreens(dt);
  // coffee machine light, steam
  const cf=props.coffee,use=cf.use!==null;cf.light.color.setHex(use?(Math.floor(T*4)%2?0xffb347:0x4a3a1a):0x4fdc92);
  for(let i=0;i<cf.steam.length;i++){const s=cf.steam[i],age=((T*.8+i/cf.steam.length)%1);s.visible=use;if(use){s.position.set(-1.5+Math.sin(age*6+i)*.08,2.7+age*1.3,.3);s.scale.setScalar(.25+.5*age);s.material.opacity=.5*Math.sin(Math.PI*age);}}
  // door
  const d=props.door;let near=false;for(const id of IDS){const p=crew[id];if(!p.hidden&&p.mode==='free'&&Math.hypot(p.x-.3,p.z+21.5)<4.2)near=true;}
  if(d.kick>0){d.kick-=dt;near=true;}d.ang=sm(d.ang,near?1.25:0,4,dt);d.hinge.rotation.y=d.ang;
  // selection ring + beams
  if(sel){const p=crew[sel];ring.visible=!p.hidden;ring.position.set(p.x,.14,p.z);ring.scale.setScalar(p.sc/1.12);ring.material.opacity=.6+.25*Math.sin(T*2.2);}
  for(const m of screens){m.material.color.setScalar(.95+.05*Math.sin(T*1.4+m.id));}
}

/* ---- card ---- */
const card=$('#card');
function select(id){sel=id;const d=INFO[id];
  $('#cn').textContent=d.name;$('#cr').textContent=d.role;
  $('#cb').innerHTML=d.bullets.map(t=>`<li>${t}</li>`).join('');$('#ch').textContent=d.how.charAt(0).toUpperCase()+d.how.slice(1);
  card.style.setProperty('--c','#'+d.color.toString(16).padStart(6,'0'));
  card.classList.add('open');card.setAttribute('aria-hidden','false');
  document.querySelectorAll('.lab').forEach(l=>l.classList.toggle('active',l.dataset.id===id));
  const p=crew[id];ring.visible=!p.hidden;ring.material.color.setHex(d.color);ring.position.set(p.x,.14,p.z);ring.scale.setScalar(p.sc/1.12);
}
function closeCard(){sel=null;card.classList.remove('open');card.setAttribute('aria-hidden','true');ring.visible=false;document.querySelectorAll('.lab.active').forEach(l=>l.classList.remove('active'));}
$('#cx').addEventListener('click',closeCard);
addEventListener('keydown',e=>{if(e.key==='Escape')closeCard();});
/* ---- picking (people, chairs, desks; works while they walk) ---- */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down=null;
const pickables=[...Object.values(stations).map(s=>s.st),...IDS.map(i=>crew[i].rig.root),...IDS.map(i=>crew[i].rig.chair)];
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>7)return;
  const r=renderer.domElement.getBoundingClientRect();mp.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mp,camera);const vis=pickables.filter(o=>o.visible);const hits=ray.intersectObjects(vis,true);
  for(const h of hits){let o=h.object;while(o&&!(o.userData&&o.userData.who))o=o.parent;if(o){select(o.userData.who);return;}}
  closeCard();
});
/* ---- framing ---- */
function frame(force){
  const w=app.clientWidth||innerWidth,h=app.clientHeight||innerHeight,a=w/h;
  const m=a<.95?'narrow':'wide';
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,m==='narrow'?1.5:2));
  renderer.setSize(w,h);lr.setSize(w,h);camera.aspect=a;
  if(force||m!==mode){
    applyLayout(m);warm();
    let D,pol,tgt;
    if(m==='narrow'){camera.fov=44;D=50;pol=.92;tgt=new THREE.Vector3(0,1.2,-3.2);}
    else{camera.fov=33;D=45.5*Math.max(1,1.6/a);pol=1.24;tgt=new THREE.Vector3(0,3.4,-1.2);}
    controls.target.copy(tgt);camera.position.set(tgt.x,tgt.y+D*Math.cos(pol),tgt.z+D*Math.sin(pol));
    controls.minDistance=D*.5;controls.maxDistance=D*1.25;controls.minPolarAngle=.35;controls.maxPolarAngle=1.38;
    controls.minAzimuthAngle=-.95;controls.maxAzimuthAngle=.95;controls.update();
  }
  camera.updateProjectionMatrix();
}
function warm(){if(reduce)return;for(let i=0;i<360;i++)simStep(.05);}
new ResizeObserver(()=>frame(false)).observe(app);
frame(true);
/* ---- loop ---- */
const _v=new THREE.Vector3();
function declutter(){ // keep activity captions from covering each other / neighbours' name chips
  const w=app.clientWidth||innerWidth,h=app.clientHeight||innerHeight,items=[];
  for(const id of IDS){const p=crew[id];if(p.hidden)continue;p.chip.getWorldPosition(_v);_v.project(camera);
    const it={p,x:(_v.x+1)/2*w,y:(1-_v.y)/2*h,nw:INFO[id].name.length*7+30,aw:p.capShown?p.capShown.length*6.4+20:0,has:!!p.capShown,dy:0,bub:null};
    if(p.bub.visible){p.bub.getWorldPosition(_v);_v.project(camera);it.bub={x:(_v.x+1)/2*w,y:(1-_v.y)/2*h-15,w:(p.bubShown||'').length*6.4+40};}
    items.push(it);}
  items.sort((a,b)=>a.y-b.y);
  for(const it of items){let dy=0;
    if(it.has)for(let k=0;k<4;k++){const cy=it.y+22+dy;let hit=false;
      for(const o of items){if(o===it)continue;
        if(Math.abs(o.x-it.x)<(o.nw+it.aw)/2+2&&Math.abs(o.y-cy)<15){hit=true;break;}
        if(o.has&&o.done&&Math.abs(o.x-it.x)<(o.aw+it.aw)/2+2&&Math.abs(o.y+22+o.dy-cy)<15){hit=true;break;}
        if(o.bub&&Math.abs(o.bub.x-it.x)<(o.bub.w+it.aw)/2+2&&Math.abs(o.bub.y-cy)<18){hit=true;break;}}
      if(!hit)break;dy+=15;}
    it.dy=dy;it.done=true;
    if(it.p.dyShown!==dy){it.p.dyShown=dy;it.p.chip.element.style.setProperty('--dy',dy+'px');}}
}
function render(){controls.update();renderer.render(scene,camera);declutter();lr.render(scene,camera);}
let lastT=performance.now();
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now();const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(!reduce&&!window.__pause){simStep(dt);if(!tick.p)tick.p=1;}
  if(!window.__pause)render();
}
tick();
function walking(p){return !p.hidden&&p.mode==='free'&&p.cur&&p.cur.k==='walk';}
function minSep(sec,dt){
  dt=dt||1/30;const n=Math.round(sec/dt),c0=CLAMPS,s0=SEPS;let md=9,ix=0,pair='',worst=null;
  for(let f=0;f<n;f++){simStep(dt);
    const L=IDS.map(i=>crew[i]).filter(p=>!p.hidden);
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];if(!walking(a)&&!walking(b))continue;const d=Math.hypot(a.x-b.x,a.z-b.z);if(d<md){md=d;pair=a.id+'-'+b.id+'@'+T.toFixed(1);}}
    let hit=false;for(const p of L){if(p.mode!=='free')continue;for(const o of OBST){const lim=o.chair?BRC:BR;if(obstDist(o,p.x,p.z)<lim-.01){hit=true;if(!worst)worst={who:p.id,o:o.n,t:+T.toFixed(1),d:+obstDist(o,p.x,p.z).toFixed(3)};}}}
    if(hit)ix++;}
  render();return {minDist:+md.toFixed(3),pair,intersections:ix,clamps:CLAMPS-c0,sepPushes:SEPS-s0,frames:n,worst};
}
window.__sim={step(s){const n=Math.round(s*30);for(let i=0;i<n;i++)simStep(1/30);},advance(s){if(!reduce){const n=Math.round(s*30);for(let i=0;i<n;i++)simStep(1/30);}render();},time:()=>T,crew,N,checkPaths,render,minSep,clog:CLOG,
  layout(m,seed,nowarm){applyLayout(m);if(seed)rnd=mb32(seed);resetSim();if(!nowarm)for(let i=0;i<360;i++)simStep(.05);},
  caps(){return IDS.map(i=>crew[i].id+':'+(crew[i].hidden?'(hidden)':'')+(crew[i].capShown||'')+(crew[i].speaking?' ['+crew[i].topic+']':'')).join(' | ');},
  scr(x,y,z){const v=new THREE.Vector3(x,y,z).project(camera);return {x:Math.round((v.x+1)/2*app.clientWidth),y:Math.round((1-v.y)/2*app.clientHeight)};},
  proj(id){const p=crew[id],v=new THREE.Vector3(p.x,2.5,p.z).project(camera);return {x:(v.x+1)/2*app.clientWidth,y:(1-v.y)/2*app.clientHeight};}};
window.__ready=true;
