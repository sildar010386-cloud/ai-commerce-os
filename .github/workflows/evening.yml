# Bikas Home evening report (owner rule: 22:00 Almaty): today's Threads stats and tomorrow's schedule to the bot.
# GitHub schedule at 22:00 Almaty (17:00 UTC) with a backup at 22:40; tools/stats/evening.py sends at most once
# per day (marker file), so two runs never send two reports. Works without Claude.
name: Evening report
on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "40 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evening
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PUBLISH_BRANCH || 'claude/practical-mendel-vjtsd5' }}
          fetch-depth: 20
      - name: Send the evening report
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIKAS_MUSIC: /tmp/no-private-repo
        run: |
          git config user.name "bikas-autopublish"
          git config user.email "bikas-autopublish@users.noreply.github.com"
          python3 tools/stats/evening.py
