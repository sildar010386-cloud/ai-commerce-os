# Free AI pictures for posts and carousels via the CRM's Cloudflare Workers AI (tools/ai/cf_image.py).
# Claude's sandbox cannot reach workers.dev, so pictures are made here and committed to the working branch.
# Manual run only; the jobs list is content/images/jobs.json (existing pictures are skipped).
name: Images
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: images
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.PUBLISH_BRANCH || 'claude/practical-mendel-vjtsd5' }}
          fetch-depth: 20
      - name: Make the pictures
        env:
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
        run: |
          pip install --quiet pillow
          python3 tools/ai/cf_image.py content/images/jobs.json
      - name: Commit the pictures
        if: always()
        run: |
          git config user.name "bikas-autopublish"
          git config user.email "bikas-autopublish@users.noreply.github.com"
          git add content
          git diff --cached --quiet || { git commit -q -m "AI pictures (Workers AI)" && git pull -q --rebase && git push -q origin HEAD; }
