<!doctype html>
<html lang="ru" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:100%;height:100%;font-family:"Liberation Sans","DejaVu Sans",sans-serif}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:60px;right:60px;top:1180px;text-align:center;font-weight:800;font-size:92px;line-height:1.1;color:#fff;
 text-shadow:0 6px 0 #000,0 0 18px rgba(0,0,0,.8);opacity:0}
.cap span{display:inline-block;margin:0 10px}
.y{color:#FFD60A}.o{color:#FF7A1A}.g{color:#3DDC84}
.hook{position:absolute;top:260px;left:70px;right:70px;text-align:center;font-weight:800;font-size:84px;color:#111;background:#FFD60A;padding:24px 20px;border-radius:24px;transform-origin:center}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
  <video id="bg" class="clip" src="clip.mp4" muted playsinline data-start="0" data-duration="6" data-track-index="0"></video>
  <div id="hook" class="hook clip" data-start="0" data-duration="2.6" data-track-index="1">Выходить через 5 минут?</div>
  <div id="c1" class="cap clip" data-start="0.3" data-duration="2.4" data-track-index="2"><span>Рубашка</span><span class="o">мятая,</span><span>а</span><span>доску</span><span class="y">не&nbsp;достать</span></div>
  <div id="c2" class="cap clip" data-start="2.8" data-duration="3.2" data-track-index="3"><span class="g">Пар</span><span>прямо</span><span>на</span><span>кровати</span><span>—</span><span class="y">без&nbsp;утюга</span></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.from("#hook", {scale:0.4, opacity:0, duration:0.35, ease:"back.out(2)"}, 0)
  .to("#hook", {rotation:-2, duration:0.15, yoyo:true, repeat:3}, 0.4)
  .to("#hook", {opacity:0, y:-60, duration:0.25}, 2.35);
function words(id, t0, step){
  tl.set(id, {opacity:1}, t0);
  document.querySelectorAll(id+" span").forEach((s,i)=>{
    tl.from(s, {opacity:0, y:40, scale:0.6, duration:0.18, ease:"back.out(3)"}, t0+i*step);
    if (s.className) tl.to(s, {scale:1.15, duration:0.12, yoyo:true, repeat:1}, t0+i*step+0.2);
  });
}
words("#c1", 0.3, 0.35);
words("#c2", 2.8, 0.38);
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
