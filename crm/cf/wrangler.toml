name = "bikas-crm"
main = "src/worker.js"
compatibility_date = "2025-01-15"
workers_dev = true

# Static UI (public/). The Worker runs first so that every asset gets the security headers.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "bikas-crm"
# Replaced by the deploy workflow (crm-deploy.yml) with the real id of the D1 database.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Every 5 minutes 09:00-20:55 Almaty (UTC+5): start publishing as soon as an approved slot is due (worker.js autoPublish);
# 09:00 Almaty: start the morning report (worker.js MORNING_CRON).
[triggers]
crons = ["*/5 4-15 * * *", "0 4 * * *"]

# Workers AI (free daily quota): FLUX.1 schnell pictures for posts and carousels (worker.js imageHook).
[ai]
binding = "AI"

[vars]
# Branch that holds the publish workflow (used by the manual-publish button).
GH_DISPATCH_REF = "claude/ai-ecommerce-automation-3n1lgz"

# Secrets (set with `wrangler secret put`, never in this file): CRM_API_KEY, GH_DISPATCH_TOKEN (optional).
